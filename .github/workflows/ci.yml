name: C and Bash checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc clang make pkg-config libjson-c-dev libarchive-dev libssl-dev bash coreutils diffutils curl ca-certificates tar gzip proot ripgrep
      - name: Install Clang Format 21 from LLVM
        if: matrix.compiler == 'clang'
        run: |
          # Ubuntu 24.04's runner image includes formatters through 18 only.
          # Keep the LLVM signing key scoped to this developer-tool repository.
          llvm_key="$RUNNER_TEMP/termux-muscle-llvm.asc"
          llvm_gnupg="$RUNNER_TEMP/termux-muscle-llvm-gnupg"
          mkdir -m 700 -- "$llvm_gnupg"
          curl -q --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            https://apt.llvm.org/llvm-snapshot.gpg.key --output "$llvm_key"
          fingerprint=$(gpg --batch --homedir "$llvm_gnupg" --show-keys --with-colons "$llvm_key" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 644 "$llvm_key" /usr/share/keyrings/termux-muscle-llvm.asc
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/termux-muscle-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/termux-muscle-llvm21.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format-21
          clang-format-21 --version
      - name: Check C formatting and developer hook regressions
        if: matrix.compiler == 'clang'
        env:
          CLANG_FORMAT: clang-format-21
        run: |
          bash scripts/check_format.sh --all
          bash tests/dev/check_format.sh
      - name: Build C helper
        run: make -j2 CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -g'
      - name: Test maintainer release tracking offline
        if: matrix.compiler == 'gcc'
        run: python3 -B -m unittest discover -s tests/dev -p 'test_track_upstream.py' -v
      - name: Run offline unit and regression tests
        run: make check
      - name: Build source assets twice and verify reproducibility
        run: |
          bash scripts/build_release.sh --output dist-first
          bash scripts/build_release.sh --output dist-second
          cmp dist-first/SHA256SUMS dist-second/SHA256SUMS
          cd dist-first
          sha256sum -c SHA256SUMS
      - name: Enforce device evidence for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          bash scripts/build_release.sh --output dist-release --release
      - name: Preserve development source assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-assets-${{ matrix.compiler }}
          path: dist-first/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified tag
    needs: checks
    if: >-
      ${{ success() && needs.checks.result == 'success' &&
          github.event_name == 'push' && github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v') &&
          github.repository == 'octocore-autonomous-systems/termux-muscle' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the tested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install release build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc make pkg-config libjson-c-dev libarchive-dev libssl-dev bash coreutils curl ca-certificates tar gzip
      - name: Verify this CI attempt and publish its exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          TM_CHECKS_RESULT: ${{ needs.checks.result }}
        run: bash scripts/publish_release.sh
