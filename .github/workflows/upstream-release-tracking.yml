name: Track upstream Claude Code

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Open a testing issue if a newer version is found
        type: boolean
        default: false

permissions:
  contents: read

# Serialize discovery and publication, including manual runs, to prevent duplicate issues.
concurrency:
  group: upstream-release-tracking
  cancel-in-progress: false

jobs:
  track:
    if: >-
      github.repository == 'octocore-autonomous-systems/termux-muscle' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release tracker offline
        run: python3 -B -m unittest discover -s tests/dev -p 'test_track_upstream.py' -v
      - name: Discover upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          TM_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: |
          options=()
          if [[ "$TM_PUBLISH" == true ]]; then options+=(--publish); fi
          python3 -B scripts/track_upstream.py "${options[@]}" \
            --output "$RUNNER_TEMP/upstream-release.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Preserve discovery metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-release-discovery
          path: ${{ runner.temp }}/upstream-release.json
          if-no-files-found: error
          retention-days: 14
